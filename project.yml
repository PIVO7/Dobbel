name: Dobbel
options:
  bundleIdPrefix: com.pivo7
  developmentLanguage: nl
  createIntermediateGroups: true

settings:
  base:
    # Nodig om op een echt toestel te bouwen; de simulator vraagt er niet om.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VB6FS3N78T
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 4
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  Dobbel:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    settings:
      base:
        # "Yahtzee" is een merk van Hasbro; alles heet hier Dobbel. Alleen de
        # datbestanden op bestaande toestellen houden hun oude yahtzee-naam
        # (zie GameStore/ProfileStore) en de bundle-id was altijd al dobbel.
        PRODUCT_BUNDLE_IDENTIFIER: com.pivo7.dobbel
        # Meertaligheid: de compiler schrijft alle localiseerbare teksten weg
        # (stringsdata), zodat de String Catalog compleet te houden is.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dobbel!
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    sources:
      - path: Dobbel

  Dobbel Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Dobbel Tests
    dependencies:
      - target: Dobbel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pivo7.dobbel.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Dobbel:
    build:
      targets:
        Dobbel: all
        Dobbel Tests: [test]
    test:
      targets:
        - Dobbel Tests
      # De tests vergelijken Nederlandse zinnen; sinds de app meertalig is
      # moet de testtaal dus vastliggen, wat de simulatortaal ook is.
      language: nl
      region: BE
    run:
      config: Debug
      storeKitConfiguration: Dobbel.storekit
    archive:
      config: Release
